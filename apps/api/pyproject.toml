[project]
name = "careerpath-api"
version = "0.1.0"
description = "CareerPath MVP FastAPI backend"
readme = "README.md"
requires-python = ">=3.13"
dependencies = [
    "fastapi>=0.111,<0.112",
    "uvicorn[standard]>=0.24",
    "sqlalchemy[asyncio]>=2.0.20,<2.2",
    "asyncpg>=0.28",
    "alembic>=1.11",
    "pydantic>=2.5",
    "pydantic-settings>=2.2",
    "pydantic-settings>=2.2",
    "python-dotenv>=1.0",
    "passlib[bcrypt]>=1.7",
    "httpx>=0.27",
    "redis>=4.6",
    "email-validator>=2.0",
    "python-multipart>=0.0",
    "structlog>=23",
    "loguru>=0.7",
    "python-jose[cryptography]>=3.4"
]

[project.optional-dependencies]
dev = [
    "pytest>=7.0",
    "pytest-asyncio>=0.21",
    "ruff>=0.1",
    "mypy>=1.8",
]

[project.scripts]
start = "uvicorn app.main:app --host 0.0.0.0 --port ${PORT:-8000}"
seed = "python -m app.scripts.seed"
migrate = "alembic upgrade head"

[build-system]
requires = ["setuptools>=68.0", "wheel"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools]
package-dir = {"" = "src"}
